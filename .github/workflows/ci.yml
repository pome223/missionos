name: MissionOS contract checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: missionos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install MissionOS and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" \
            -e packages/missionos-core \
            -e packages/missionos-cli \
            -e packages/missionos-gateway

      - name: Lint maintained authority and Gateway boundaries
        run: |
          python -m ruff check \
            packages/missionos-cli \
            packages/missionos-gateway \
            scripts/smoke_missionos_real_hardware_arm_disarm_route.py \
            scripts/smoke_mission_designer_envelope_violation_advisory.py \
            scripts/check_yokohama_pad_advisory.py \
            scripts/run_yokohama_pad_reentry.py \
            scripts/evaluate_yokohama_pad_reentry.py \
            scripts/check_yokohama_pad_reentry.py \
            scripts/export_yokohama_pad_reentry.py \
            scripts/check_yokohama_pad_focus.py \
            scripts/diagnose_yokohama_pad_focus.py \
            scripts/capture_yokohama_pad_focus.py \
            scripts/evaluate_yokohama_pad_focus.py \
            scripts/export_yokohama_pad_focus.py \
            scripts/prepare_yokohama_pad_focus.py \
            scripts/train_yokohama_pad_focus.py \
            scripts/yokohama_pad_focus_data.py \
            tests/test_yokohama_pad_focus.py \
            src/runtime/yokohama_pad_reentry_risk.py \
            tests/test_yokohama_pad_reentry.py \
            scripts/check_yokohama_pad_reentry_sources.py \
            scripts/evaluate_yokohama_pad_judge.py \
            tests/test_yokohama_pad_judge_evaluation.py \
            src/intelligence/yokohama_delivery_agents.py \
            tests/contract/test_yokohama_delivery_chat.py \
            tests/test_yokohama_delivery_agents.py \
            tests/test_yokohama_pad_mission_judge.py \
            tests/test_yokohama_pad_reentry_sources.py \
            scripts/export_yokohama_pad_advisory.py \
            scripts/verify_yokohama_pad_advisory.py \
            scripts/yokohama_pad_advisory_host.py \
            scripts/yokohama_pad_advisory_worker.py \
            scripts/smoke_px4_gazebo_mission_designer_execute_sitl_gateway.py \
            scripts/smoke_px4_gazebo_mission_designer_prompt_to_sitl_e2e.py \
            scripts/smoke_px4_gazebo_mission_designer_sitl_delivery_epic_exit.py \
            scripts/smoke_px4_gazebo_mission_designer_sitl_delivery_epic_exit_no_preexisting_summary.py \
            scripts/smoke_px4_gazebo_mission_designer_sitl_dropoff_verification.py \
            scripts/smoke_px4_gazebo_mission_designer_sitl_flight_evidence.py \
            scripts/smoke_px4_gazebo_mission_designer_sitl_payload_release_observation.py \
            src/cli/missionos.py \
            src/config \
            src/gateway \
            src/runtime/runtime_claim_evidence.py \
            src/runtime/yokohama_pad_advisory_contract.py \
            src/runtime/task_store.py \
            src/runtime/missionos_real_hardware_dispatch_runtime.py \
            src/runtime/px4_gazebo_mission_designer_sitl_runner.py \
            tests/contract/test_cli_fixture_job_status.py \
            tests/contract/test_cli_intent_route_hints.py \
            tests/contract/test_cli_live_sitl_timeout.py \
            tests/contract/test_gateway_chat_language.py \
            tests/contract/test_hardware_adapter_contract.py \
            tests/contract/test_production_gateway_backend.py \
            tests/contract/test_runtime_claim_evidence.py \
            tests/contract/test_sitl_execution_operator_approval.py \
            tests/contract/test_task_store_atomic_updates.py

      - name: Run contract suite
        env:
          PYTHONPATH: .:packages/missionos-cli/src:packages/missionos-gateway/src
        run: python -m pytest -q

      - name: Verify urban-only decision control with CPU doubles
        run: python scripts/smoke_ship_urban_loop.py --output-dir /tmp/ship-urban-loop-ci

      - name: Verify WAM-informed pad selection with CPU doubles
        run: |
          python scripts/check_yokohama_pad_prediction.py \
            --native-probe docs/examples/yokohama-pad-native-probe \
            --output /tmp/yokohama-pad-prediction-ci.json

      - name: Reopen native temporal pad evidence without GPU
        run: |
          python scripts/probe_yokohama_pad_temporal.py \
            --inputs docs/examples/yokohama-pad-temporal/prepared/inputs \
            --output /tmp/unused-pad-temporal-ci
          python scripts/check_yokohama_pad_temporal.py \
            --bundle docs/examples/yokohama-pad-temporal

      - name: Reopen conditional dynamic WAM post-training without GPU
        run: |
          python scripts/check_yokohama_pad_learning.py \
            --bundle docs/examples/yokohama-pad-learning

      - name: Recompute learned CPU pad state from recorded RGB
        run: |
          python scripts/check_yokohama_pad_state.py \
            --bundle docs/examples/yokohama-pad-state

      - name: Recompute live pad advisory and delivery receipts without GPU
        run: |
          python scripts/check_yokohama_pad_advisory.py \
            --bundle docs/examples/yokohama-pad-advisory

      - name: Recompute returning-lead advice from recorded RGB
        run: |
          python scripts/check_yokohama_pad_reentry_sources.py \
            --bundle docs/examples/yokohama-pad-reentry-learning
          python scripts/check_yokohama_pad_reentry_sources.py \
            --bundle docs/examples/yokohama-pad-reentry

      - name: Reopen native regional pad forecasts without GPU
        run: |
          python scripts/check_yokohama_pad_focus.py \
            --bundle docs/examples/yokohama-pad-native-focus

      - name: Verify Jev mode selection through the Gateway
        env:
          PYTHONPATH: .:packages/missionos-cli/src:packages/missionos-gateway/src
        run: python scripts/smoke_jev_modes_gateway.py

      - name: Verify online ACWM published evidence
        run: |
          python docs/assets/acwm-online-stacking-20260921/verify_report.py --statistics
          python -m pytest docs/assets/acwm-online-stacking-20260921/test_verify_report.py -q

      - name: Verify governed ACWM published evidence
        run: |
          python docs/assets/acwm-governed-stacking-20260921/verify_report.py
          python -m pytest docs/assets/acwm-governed-stacking-20260921/test_verify_report.py -q

      - name: Verify terminal-hold ACWM published evidence
        run: |
          python docs/assets/acwm-stop-forecast-20260922/verify_report.py
          python -m pytest docs/assets/acwm-stop-forecast-20260922/test_verify_report.py -q

      - name: Verify Go2 delivery report artifacts
        run: python docs/assets/go2-agent-delivery-20260925/verify_report.py

      - name: Enforce v0.1.0 two-backend stable gate
        env:
          PYTHONPATH: .:packages/missionos-cli/src:packages/missionos-gateway/src
        run: python scripts/check_v0_1_0_stable_gate.py --pretty

      - name: Enforce v0.2.0 versioned evidence gate
        env:
          PYTHONPATH: .:packages/missionos-cli/src:packages/missionos-gateway/src
        run: python scripts/check_v0_2_0_stable_gate.py --pretty

      - name: Verify smoke inventory coverage
        run: python scripts/check_smoke_inventory.py --pretty
