[project]
name = "missionos-core"
version = "0.1.1"
description = "Backend-neutral MissionOS evidence, feasibility, and claim contracts."
license = "Apache-2.0"
readme = "README.md"
# Core stays dependency-free and importable by supported Python 3.10 backend
# adapter runtimes.
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
