<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="go2-page-token" content="__PAGE_TOKEN__">
<title>MissionOS — 犬さんへの配送依頼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1623;color:#eaf2fb;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1420px;margin:auto;padding:22px 26px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:27px;margin:3px 0}small{color:#86bce9;letter-spacing:.1em}p{margin:4px 0;color:#a8bad0}.badge{background:#173547;border:1px solid #336078;border-radius:30px;padding:7px 15px;color:#a1dfed}.layout{display:grid;grid-template-columns:370px minmax(0,1fr);gap:18px}.panel{border:1px solid #283c51;background:#122032;border-radius:13px;overflow:hidden}.chat{display:flex;flex-direction:column;height:calc(100vh - 147px);min-height:520px;max-height:820px}.messages{overflow:auto;flex:1;padding:20px}.bubble{padding:12px 14px;border-radius:11px;margin:0 0 14px;background:#1e3046;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:#245067;margin-left:32px}.bubble.notice{font-size:13px;background:none;border-left:2px solid #4cac93;color:#9dd9c8;border-radius:0}.bubble.error{border-left-color:#eea96b;color:#f2c195}.composer{padding:16px;border-top:1px solid #2b3e52}label{font-size:13px;color:#a9bed3}select,input,button{font:inherit}select,input{border:1px solid #3a5067;background:#102034;color:white;border-radius:8px;padding:10px}select{width:100%;margin:5px 0 11px}form{display:flex;gap:7px}input{min-width:0;flex:1}button{cursor:pointer;border:1px solid #47728f;border-radius:8px;background:#285473;color:white;padding:9px 14px}button:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:9px;margin-top:12px}.approve{background:#24745e;border-color:#49b28d;flex:1}.stop{background:#523c32;border-color:#9b6950}.viewer{display:flex;flex-direction:column}.view-head{padding:16px 20px;display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #283c51}.view-head b{font-size:18px;color:#a1e6cd}.stage{position:relative;min-height:340px;display:flex;align-items:center;justify-content:center;background:#09121c;aspect-ratio:1.6}.stage img{width:100%;display:none}.empty{padding:35px;text-align:center;color:#88a0b9}.facts{display:flex;gap:22px;flex-wrap:wrap;padding:14px 20px;font-size:13px;border-top:1px solid #263b50}.facts span{color:#91d8c1}.links{padding:0 20px 14px}.links a{color:#92c7f4;margin-right:18px;text-decoration:none;font-size:14px}.footnote{font-size:12px;color:#8fa6be;margin:10px 2px}.time{font-variant-numeric:tabular-nums;white-space:nowrap;color:#a8bed4}@media(max-width:950px){.layout{grid-template-columns:1fr}.chat{height:460px;min-height:0}header{align-items:start;gap:14px}h1{font-size:23px}main{padding:15px}.badge{font-size:12px}.stage{min-height:240px}}
</style>
<main>
<header><div><small>MISSIONOS / UNITREE GO2</small><h1>犬さんに配送を頼む</h1><p>目的地を伝える。計画を承認する。あとは配送の進行を見守る。</p></div><div class="badge">屋内シミュレーション</div></header>
<div class="layout">
<section class="panel chat" aria-label="MissionOSチャット">
<div class="messages" id="messages" aria-live="polite"><div class="bubble">「会議室Aへ届けて」と依頼してください。受付から出発し、模擬受領を確認して受付へ戻る計画を作ります。</div></div>
<div class="composer"><label for="scenario">試す場面</label><select id="scenario"><option value="moving_obstacle">動く障害物を避けて配送</option><option value="baseline">通常の配送</option><option value="blocked_passage">途中で片方の通路を塞ぐ</option><option value="all_blocked">両方の通路が塞がり、再開時刻が不明</option><option value="temporary_blockage">両方の通路が一時的に塞がる</option></select>
<label for="supervision">管制方法</label><select id="supervision"><option value="rules" selected>固定ルールで管制</option><option value="agent">MissionOS Agentが状況を判断（有効化が必要）</option></select>
<form id="form"><input id="instruction" aria-label="配送の依頼" value="会議室Aへ届けて" maxlength="500" autocomplete="off"><button id="send" type="submit">送信</button></form>
<div class="actions"><button type="button" class="approve" id="approve" disabled>承認して配送開始</button><button type="button" class="stop" id="stop" disabled>中止</button></div></div>
</section>
<section class="panel viewer" aria-label="Go2の配送状況"><div class="view-head"><b id="phase">配送の依頼を待っています</b><span class="time" id="sim-time"></span></div>
<div class="stage"><div class="empty" id="empty">配送を開始すると、ここにGo2シミュレータの映像が表示されます。</div><img id="live" alt="実行中のGo2物理シミュレータ"></div>
<div class="bubble notice" id="judgment" hidden></div>
<div class="bubble notice" id="avoidance" hidden></div>
<div class="facts"><div>模擬受領：<span id="receipt">未確認</span></div><div>配送・帰還：<span id="completion">未完了</span></div><div>配送ID：<span id="task">—</span></div></div>
<div class="links"><a id="movie" hidden target="_blank">実行の録画を見る</a><a id="result" hidden target="_blank">検証結果</a></div>
</section>
</div>
<p class="footnote">配送の操作と進行状況はMissionOSに記録されます。位置・障害物情報はシミュレータから取得し、受領も模擬しています。実機や実物の荷物は動かしません。</p>
</main>
<script>
const $=id=>document.getElementById(id), token=document.querySelector('meta[name="go2-page-token"]').content;
let context={},summary={},busy=false,lastPhase='',currentImage='',lastImageAt=0,lastDecision='',lastAvoidance='';
const active=()=>['starting','running','cancel_requested'].includes(summary.status);
function bubble(text,kind=''){const el=document.createElement('div');el.className='bubble '+kind;el.textContent=text;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight;}
function controls(){const running=active();$('approve').disabled=busy||!['proposed','approved'].includes(summary.status);$('stop').disabled=busy||!running;$('send').disabled=busy||running;$('scenario').disabled=busy||running;$('supervision').disabled=busy||running;$('instruction').disabled=busy||running;}
function show(payload,quiet){const next=payload.mission_designer;if(next?.go2_delivery_task_id){context={mission_designer_context_ref:next.mission_designer_context_ref,mission_designer_context_sha256:next.mission_designer_context_sha256,mission_designer_context_session_id:next.mission_designer_context_session_id};const previousTask=summary.task_id;summary=next.summary||{};if(previousTask!==summary.task_id){if(currentImage)URL.revokeObjectURL(currentImage);currentImage='';$('live').removeAttribute('src');$('live').style.display='none';$('empty').style.display='block';}}
 const phase=summary.phase||'配送の依頼を待っています';$('phase').textContent=phase;$('task').textContent=summary.task_id||'—';$('receipt').textContent=summary.simulated_receipt_observed?'確認済み':'未確認';$('completion').textContent=summary.completion_claimed?'確認済み':'未完了';const t=summary.snapshot?.sim_time_s;$('sim-time').textContent=t==null?'':`シミュレータ内 ${t.toFixed(1)} 秒`;
 if(!quiet&&payload.message)bubble(payload.message,payload.operation_result?.error?'notice error':'');else if(quiet&&phase!==lastPhase)bubble(phase,'notice');lastPhase=phase;
 const latest=summary.judgments?.at(-1);$('judgment').hidden=!latest;if(latest){const labels={wait:'待つ',reroute:'経路を再計画して配送を再開する',return_home:'配送を見送り受付へ戻る',request_operator:'停止して人に確認する'};const text=`Agentの判断：${labels[latest.proposal?.action]||'判断を確認できません'}\n${latest.proposal?.rationale||''}${latest.blocking_reasons?.length?'\n承認範囲・状況の確認で停止しました。':''}`;$('judgment').textContent=text;const key=summary.task_id+latest.observation_id;if(key!==lastDecision){bubble(text,'notice');lastDecision=key;}}
 const avoidance=summary.local_avoidance;$('avoidance').hidden=!avoidance?.event;if(avoidance?.event){const labels={dynamic_yield_requested:'犬側の回避：動く障害物の接近を検知し、停止を要求しました。',dynamic_stop_observed:'犬側の回避：速度が下がり、停止状態を確認しました。',dynamic_path_clear_observed:'犬側の回避：進路が空いたことを確認し、配送を再開しました。',dynamic_yield_budget_exhausted:'犬側の回避：待機時間を超えたため、MissionOSに状況を返しました。'};let text=labels[avoidance.event]||'';const d=summary.dynamic_avoidance;if(d?.minimum_conservative_clearance_m!=null)text+=` 接触 ${d.contact_physics_steps===0?'なし':'あり'}・余裕距離の最小値 ${d.minimum_conservative_clearance_m.toFixed(2)} m（犬の周囲45 cmを含む計算）。`;$('avoidance').textContent=text;const key=summary.task_id+avoidance.event+avoidance.sim_time_s;if(key!==lastAvoidance){bubble(text,'notice');lastAvoidance=key;}}
 const ended=['completed','needs_attention','canceled','returned_undelivered'].includes(summary.status);$('movie').hidden=!ended;$('result').hidden=!ended;if(summary.task_id){$('movie').href=`/assets/${summary.task_id}/delivery.mp4`;$('result').href=`/assets/${summary.task_id}/result.json`;}try{sessionStorage.setItem('go2-chat',JSON.stringify({token,context,summary,scenario:$('scenario').value,supervision:$('supervision').value}));}catch(_){}controls();}
async function send(instruction,quiet=false){if(busy)return;busy=true;controls();if(!quiet)bubble(instruction,'user');try{const r=await fetch('/conversation',{method:'POST',headers:{'Content-Type':'application/json','X-Go2-Token':token},body:JSON.stringify({operator_instruction:instruction,mission_designer_context:context,go2_scenario:$('scenario').value,go2_supervision_mode:$('supervision').value})});const p=await r.json();if(!r.ok)throw new Error(p.message||'接続できませんでした');show(p,quiet);}catch(e){if(!quiet)bubble(e.message,'notice error');}finally{busy=false;controls();}}
async function refreshImage(){if(!summary.task_id||Date.now()-lastImageAt<700)return;lastImageAt=Date.now();try{const r=await fetch(`/assets/${summary.task_id}/live.jpg`,{cache:'no-store'});if(!r.ok)return;const blob=await r.blob(),url=URL.createObjectURL(blob);$('live').src=url;$('live').style.display='block';$('empty').style.display='none';if(currentImage)URL.revokeObjectURL(currentImage);currentImage=url;}catch(_){}}
$('form').onsubmit=e=>{e.preventDefault();const text=$('instruction').value.trim();if(text)send(text);};$('approve').onclick=()=>send('承認して開始');$('stop').onclick=()=>send('中止');
try{const saved=JSON.parse(sessionStorage.getItem('go2-chat')||'null');if(saved?.token===token&&saved.summary?.task_id){context=saved.context;summary=saved.summary;if(saved.scenario)$('scenario').value=saved.scenario;if(saved.supervision)$('supervision').value=saved.supervision;show({mission_designer:{...context,go2_delivery_task_id:summary.task_id,summary}},true);send('/status',true);}}catch(_){}
setInterval(async()=>{if(active())await send('/status',true);if(summary.task_id)await refreshImage();},1000);
</script>
</html>
